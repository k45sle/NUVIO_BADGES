<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="A self-hosted home media infrastructure dashboard linking to media services.">
  <meta name="theme-color" content="#140a12" id="theme-color-meta">
  <meta name="robots" content="noindex, nofollow">

  <!-- Mobile / iOS PWA Integration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RJ Home">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <title>RJ Home Media Dashboard</title>

  <!-- Inline SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23140a12'/><rect x='20' y='20' width='25' height='25' rx='6' fill='%23ec4899'/><rect x='55' y='20' width='25' height='25' rx='6' fill='%23ec4899'/><rect x='20' y='55' width='25' height='25' rx='6' fill='%23ec4899'/><rect x='55' y='55' width='25' height='25' rx='6' fill='%23f472b6'/></svg>">

  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else {
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', systemDark ? 'dark' : 'light');
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root[data-theme="dark"] {
      --bg-color: #140a12;
      --bg-gradient: radial-gradient(circle at 50% 0%, #2e1224 0%, #140a12 85%);
      --accent: #ec4899;
      --text-main: #fdf2f8;
      --text-muted: #f4a8c4;
      --card-bg: rgba(38, 18, 32, 0.65);
      --card-hover-bg: rgba(56, 24, 46, 0.85);
      --header-bg: rgba(30, 13, 25, 0.55);
      --shadow: 0 10px 32px -10px rgba(0, 0, 0, 0.65);
    }

    :root[data-theme="light"] {
      --bg-color: #fff5f7;
      --bg-gradient: radial-gradient(circle at 50% 0%, #fce7f3 0%, #fff5f7 85%);
      --accent: #db2777;
      --text-main: #4c0519;
      --text-muted: #9d4b68;
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-hover-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.55);
      --shadow: 0 10px 30px -10px rgba(219, 39, 119, 0.1);
    }

    :root {
      --accent-glow: color-mix(in srgb, var(--accent) 28%, transparent);
      --card-border: color-mix(in srgb, var(--accent) 20%, transparent);
      --card-hover-border: color-mix(in srgb, var(--accent) 55%, transparent);
    }

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body { width: 100%; overflow-x: hidden; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
      transition: background-color 0.4s ease, color 0.4s ease;
      position: relative;
    }

    #ambient-glow {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 75vw; height: 75vh; border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none; z-index: 0; opacity: 0.65;
      transition: background 0.6s ease, opacity 0.6s ease;
      filter: blur(70px);
    }

    #sakura-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: auto; z-index: 0;
    }

    .container { width: 100%; max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2.5rem; padding: 0.85rem 1.25rem;
      background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border); border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(244, 114, 182, 0.15); color: #f472b6;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.25);
    }
    .brand-logo { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand-text h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
    .brand-text p { font-size: 0.75rem; color: var(--text-muted); }

    .header-right { display: flex; align-items: center; gap: 1rem; }
    .clock-widget { text-align: right; }
    .time { font-size: 0.9rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .date { font-size: 0.725rem; color: var(--text-muted); }

    .theme-toggle {
      background: transparent; border: 1px solid var(--card-border);
      color: var(--text-main); min-width: 44px; min-height: 44px; border-radius: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; touch-action: manipulation;
    }
    .theme-toggle:active { transform: scale(0.92); }

    [data-theme="dark"] #icon-moon { display: none; }
    [data-theme="dark"] #icon-sun { display: block; }
    [data-theme="light"] #icon-sun { display: none; }
    [data-theme="light"] #icon-moon { display: block; }

    .grid-wrapper {
      container-type: inline-size;
      container-name: grid-container;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      perspective: 1200px;
    }

    @container grid-container (max-width: 400px) {
      .grid { grid-template-columns: 1fr; gap: 1rem; }
      .card { padding: 1.15rem 1.2rem; }
    }

    /* Independent float animation per card */
    @keyframes cardFloat {
      0% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
      50% { transform: translateY(-7px) rotateX(3deg) rotateY(-2deg); }
      100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
    }

    .card {
      text-decoration: none; color: inherit; background: var(--card-bg);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); border-radius: 20px; padding: 1.35rem 1.5rem;
      display: flex; flex-direction: column; justify-content: space-between; gap: 1.25rem;
      position: relative; overflow: hidden;
      cursor: pointer; transform-style: preserve-3d;
      transition: transform 0.18s cubic-bezier(0.1, 0.8, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
      box-shadow: var(--shadow);
      animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both, cardFloat 5.5s ease-in-out infinite;
      animation-delay: calc(var(--i, 0) * 70ms), calc(var(--i, 0) * 1.4s + 0.5s);
      will-change: transform;
    }

    .card::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      background: radial-gradient(
        400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(255, 255, 255, 0.22),
        transparent 40%
      );
      pointer-events: none; opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 2;
    }

    .card:hover::after, .card:active::after { opacity: 1; }
    .card:hover { animation-play-state: paused; }
    .card:active { transform: scale(0.96) translateZ(10px) !important; transition: transform 0.1s ease; }

    .card-top { display: flex; align-items: center; justify-content: space-between; transform: translateZ(20px); }
    .card-top-right { display: flex; align-items: center; gap: 0.5rem; }

    .latency-pill {
      font-size: 0.625rem; font-weight: 600; font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em; padding: 0.18rem 0.5rem; border-radius: 12px;
      border: 1px solid var(--card-border); transition: all 0.35s ease;
      display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    }

    .latency-pill[data-status="checking"] {
      background: rgba(148, 163, 184, 0.1); border-color: rgba(148, 163, 184, 0.25);
      color: var(--text-muted); animation: badgePulse 1.6s ease-in-out infinite;
    }
    .latency-pill[data-status="up"] {
      background: rgba(34, 197, 94, 0.12); border-color: rgba(34, 197, 94, 0.35);
      color: #4ade80; box-shadow: 0 0 10px rgba(34, 197, 94, 0.25);
    }
    .latency-pill[data-status="degraded"] {
      background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35);
      color: #fbbf24; box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
    }
    .latency-pill[data-status="down"] {
      background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4);
      color: #f87171; box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }

    @keyframes badgePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .card-icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      position: relative; flex-shrink: 0; transform: translateZ(35px);
      transition: transform 0.3s ease;
    }

    .card-icon::before {
      content: ''; position: absolute; inset: -4px; border-radius: 18px;
      background: inherit; filter: blur(10px); opacity: 0.6; z-index: -1;
      transition: opacity 0.3s ease;
    }

    /* Redesigned Dynamic Icon Styling & Animations */
    .card-icon[data-service="stream"] {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff; box-shadow: 0 4px 22px rgba(99, 102, 241, 0.45);
    }
    .card-icon[data-service="stream"] svg { animation: streamAura 2.8s ease-in-out infinite; }

    .card-icon[data-service="meta"] {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      color: #ffffff; box-shadow: 0 4px 22px rgba(236, 72, 153, 0.45);
    }
    .card-icon[data-service="meta"] svg { animation: metaShimmer 3s ease-in-out infinite; }

    .card-icon[data-service="nuvio"] {
      background: linear-gradient(135deg, #f43f5e 0%, #fb7185 50%, #fb923c 100%);
      color: #ffffff; box-shadow: 0 4px 22px rgba(244, 63, 94, 0.45);
    }
    .card-icon[data-service="nuvio"] svg { animation: nuvioBloom 2.6s ease-in-out infinite; }

    /* High-energy overhauled animations */
    @keyframes streamAura {
      0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 2px rgba(255,255,255,0.6)); }
      25% { transform: scale(1.2) rotate(-10deg) translateY(-2px); filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.9)); }
      50% { transform: scale(0.92) rotate(6deg) translateY(1px); filter: drop-shadow(0 0 4px rgba(99, 102, 241, 0.5)); }
      75% { transform: scale(1.15) rotate(-4deg); filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.8)); }
      100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 2px rgba(255,255,255,0.6)); }
    }

    @keyframes metaShimmer {
      0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 4px rgba(236,72,153,0.5)); }
      50% { transform: scale(1.22) rotate(180deg); filter: drop-shadow(0 0 16px rgba(244,114,182,1)); }
      100% { transform: scale(1) rotate(360deg); filter: drop-shadow(0 0 4px rgba(236,72,153,0.5)); }
    }

    @keyframes nuvioBloom {
      0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 4px rgba(244,63,94,0.5)); }
      30% { transform: scale(1.22) translateY(-3px) rotate(8deg); filter: drop-shadow(0 0 16px rgba(251,146,60,0.95)); }
      70% { transform: scale(0.9) translateY(2px) rotate(-6deg); filter: drop-shadow(0 0 6px rgba(244,63,94,0.7)); }
    }

    .external-link-icon { color: var(--text-muted); opacity: 0.45; transition: all 0.2s ease; transform: translateZ(15px); }
    .card:hover .external-link-icon { opacity: 0.9; transform: translateZ(15px) translate(2px, -2px); }

    .card-content { transform: translateZ(25px); }
    .card-content h4 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }

    .site-footer { margin-top: 3rem; text-align: center; font-size: 0.75rem; color: var(--text-muted); }

    @media (max-width: 640px) {
      header { margin-bottom: 1.5rem; padding: 0.75rem 1rem; }
      .clock-widget { display: none; }
    }
  </style>
</head>
<body>

  <div id="ambient-glow"></div>
  <canvas id="sakura-canvas"></canvas>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <img class="brand-logo" src="https://i.postimg.cc/43xmDctx/ezgif-com-resize.gif" alt="RJ Home Media logo">
        </div>

          <svg id="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg id="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 0 1 1-9-9Z"/></svg>

    <div class="grid-wrapper">
      <div class="grid">
        <!-- Card 1: AIOStreams -->
        <a class="card" href="https://rstream.237119.xyz" target="_blank" rel="noopener noreferrer" style="--i:0; --glow-color: rgba(99, 102, 241, 0.45);" data-key="0">

              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>

              <span class="latency-pill" id="ping-1" data-status="checking">-- ms</span>

              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
            </div>
            <div class="card-top-right">
              <span class="latency-pill" id="ping-2" data-status="checking">-- ms</span>
              <svg class="external-link-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M17 7 7 17"/></svg>

  <script>
    window.petalsArray = [];

    function triggerHaptic(type = 'light') {
      if ('vibrate' in navigator) {
        if (type === 'light') navigator.vibrate(10);
        else if (type === 'medium') navigator.vibrate(22);
      }
    }

    class SoundFX {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playLaunch() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch(e) {}
      }
    }
    const sfx = new SoundFX();

    let isTabActive = true;
    document.addEventListener('visibilitychange', () => { isTabActive = !document.hidden; });

    (function setupSakura() {
      const canvas = document.getElementById('sakura-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      const isMobile = window.innerWidth < 640;
      const petalCount = isMobile ? 24 : 45;

      class Petal {
        constructor() { this.reset(); }
        reset() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          this.x = Math.random() * w;
          this.y = Math.random() * h - h;
          this.vx = 0; this.vy = 0;
          this.size = Math.random() * 6 + 4;
          this.speedY = Math.random() * 0.9 + 0.5;
          this.speedX = Math.random() * 0.4 - 0.2;
          this.rotation = Math.random() * 360;
          this.rotationSpeed = Math.random() * 1.2 - 0.6;
          this.opacity = Math.random() * 0.45 + 0.35;
          this.swing = Math.random() * 2;
          this.swingSpeed = Math.random() * 0.02 + 0.01;
        }
        update() {
          this.swing += this.swingSpeed;
          this.x += Math.sin(this.swing) + this.speedX + this.vx;
          this.y += this.speedY + this.vy;
          this.rotation += this.rotationSpeed;
          this.vx *= 0.92; this.vy *= 0.92;

          const w = window.innerWidth;
          const h = window.innerHeight;
          if (this.y > h + 20 || this.x < -20 || this.x > w + 20) {
            this.reset();
            this.y = -10;
          }
        }
        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate((this.rotation * Math.PI) / 180);
          ctx.globalAlpha = this.opacity;
          ctx.fillStyle = '#f472b6';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size, 0, this.size * 1.5);
          ctx.bezierCurveTo(this.size, this.size, this.size, -this.size / 2, 0, 0);
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = 0; i < petalCount; i++) {
        const p = new Petal();
        p.y = Math.random() * window.innerHeight;
        window.petalsArray.push(p);
      }

      window.addEventListener('mousemove', (e) => {
        const mouseX = e.clientX;
        const mouseY = e.clientY;
        window.petalsArray.forEach(p => {
          const dx = p.x - mouseX;
          const dy = p.y - mouseY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 130) {
            const angle = Math.atan2(dy, dx);
            const force = (130 - dist) * 0.08;
            p.vx += Math.cos(angle) * force;
            p.vy += Math.sin(angle) * force;
          }
        });
      });

      window.addEventListener('touchstart', (e) => {
        if (!e.touches[0]) return;
        const touchX = e.touches[0].clientX;
        const touchY = e.touches[0].clientY;
        window.petalsArray.forEach(p => {
          const dx = p.x - touchX;
          const dy = p.y - touchY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 160) {
            const angle = Math.atan2(dy, dx);
            const force = (160 - dist) * 0.15;
            p.vx += Math.cos(angle) * force;
            p.vy += Math.sin(angle) * force;
          }
        });
      }, { passive: true });

      function animate() {
        if (isTabActive) {
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          window.petalsArray.forEach((p) => { p.update(); p.draw(); });
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();

    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.card');
      const ambientGlow = document.getElementById('ambient-glow');
      const isFinePointer = window.matchMedia('(pointer: fine)').matches;

      cards.forEach(card => {
        card.addEventListener('click', () => {
          triggerHaptic('medium');
          sfx.playLaunch();
        });
      });

      // Enhanced 3D Movement with wider freedom & independent z-pop
      if (isFinePointer) {
        cards.forEach((card, idx) => {
          card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            // Expanded rotation ranges for more dynamic freedom
            const rotateX = ((y - centerY) / centerY) * -22;
            const rotateY = ((x - centerX) / centerX) * 22;

            card.style.transform = `perspective(1200px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateZ(28px) scale3d(1.03, 1.03, 1.03)`;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);

            const glowColor = card.style.getPropertyValue('--glow-color');
            if (glowColor && ambientGlow) {
              ambientGlow.style.background = `radial-gradient(circle, ${glowColor} 0%, rgba(0,0,0,0) 70%)`;
            }
          });

          card.addEventListener('mouseleave', () => {
            card.style.transform = '';
            if (ambientGlow) {
              ambientGlow.style.background = 'radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%)';
            }
          });
        });
      }

      // Gyroscope tilt with per-card independent phase offsets
      if (!isFinePointer && window.DeviceOrientationEvent) {
        let rawTargetX = 0, rawTargetY = 0;
        let currentTiltX = 0, currentTiltY = 0;
        let hasGyroData = false;

        window.addEventListener('deviceorientation', (e) => {
          if (e.gamma === null || e.beta === null) return;
          hasGyroData = true;

          rawTargetX = Math.min(Math.max(-e.gamma, -35), 35) / 2.2;
          rawTargetY = Math.min(Math.max(-(e.beta - 40), -35), 35) / 2.2;

          if (window.petalsArray) {
            window.petalsArray.forEach(p => {
              p.vx += (-e.gamma / 45) * 0.05;
            });
          }
        }, true);

        function smoothGyroLoop() {
          if (hasGyroData) {
            currentTiltX += (rawTargetX - currentTiltX) * 0.1;
            currentTiltY += (rawTargetY - currentTiltY) * 0.1;

            cards.forEach((card, idx) => {
              // Independent phase offset per card
              const offsetFactor = (idx - 1) * 2.5;
              const cardTiltX = currentTiltX + offsetFactor;
              const cardTiltY = currentTiltY - (offsetFactor * 0.6);

              card.style.transform = `perspective(1200px) rotateX(${cardTiltY.toFixed(2)}deg) rotateY(${cardTiltX.toFixed(2)}deg) translateZ(8px)`;

              const sheenX = ((-cardTiltX * 2.2 + 35) / 70) * 100;
              const sheenY = ((-cardTiltY * 2.2 + 35) / 70) * 100;
              card.style.setProperty('--mouse-x', `${sheenX}%`);
              card.style.setProperty('--mouse-y', `${sheenY}%`);
            });
          }
          requestAnimationFrame(smoothGyroLoop);
        }
        smoothGyroLoop();
      }

      function updateClock() {
        const clockTime = document.getElementById('clock-time');
        const clockDate = document.getElementById('clock-date');
        if (!clockTime || !clockDate) return;
        const now = new Date();
        clockTime.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        clockDate.textContent = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      }
      updateClock();
      setInterval(updateClock, 1000);

      const toggleBtn = document.getElementById('theme-toggle');
      const themeColorMeta = document.getElementById('theme-color-meta');
      const htmlElement = document.documentElement;

      function setTheme(theme) {
        htmlElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        if (toggleBtn) toggleBtn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
        if (themeColorMeta) themeColorMeta.setAttribute('content', theme === 'dark' ? '#140a12' : '#fff5f7');
      }

      const initialTheme = htmlElement.getAttribute('data-theme') || 'dark';
      setTheme(initialTheme);

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          triggerHaptic('light');
          setTheme(htmlElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });
      }

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (!localStorage.getItem('theme')) setTheme(e.matches ? 'dark' : 'light');
      });

      async function checkStatus(card) {
        const pill = card.querySelector('.latency-pill');
        const targetUrl = card.getAttribute('data-health-url') || card.getAttribute('href');
        if (!pill || !targetUrl) return;

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5000);
        const startTime = performance.now();

        try {
          const res = await fetch(targetUrl, { method: 'GET', mode: 'cors', cache: 'no-store', signal: controller.signal });
          const latency = Math.round(performance.now() - startTime);

          if (res.ok) {
            pill.dataset.status = 'up';
            pill.textContent = `${latency} ms`;
          } else {
            pill.dataset.status = 'degraded';
            pill.textContent = `ERR ${res.status}`;
          }
        } catch (err) {
          try {
            const fallbackController = new AbortController();
            const fallbackTimeout = setTimeout(() => fallbackController.abort(), 5000);
            await fetch(targetUrl, { method: 'GET', mode: 'no-cors', cache: 'no-store', signal: fallbackController.signal });
            clearTimeout(fallbackTimeout);

            const latency = Math.round(performance.now() - startTime);
            pill.dataset.status = 'up';
            pill.textContent = `${latency} ms`;
          } catch (fallbackErr) {
            pill.dataset.status = 'down';
            pill.textContent = 'Offline';
          }
        } finally {
          clearTimeout(timeout);
        }
      }

      function checkAllStatuses() { document.querySelectorAll('.card[href]').forEach(checkStatus); }
      checkAllStatuses();
      setInterval(checkAllStatuses, 45000);

      const DASHBOARD_UPDATED = '2026-08-28';
      const lastUpdatedEl = document.getElementById('last-updated');
      if (lastUpdatedEl) {
        const d = new Date(DASHBOARD_UPDATED + 'T00:00:00');
        lastUpdatedEl.textContent = isNaN(d.getTime()) ? 'unknown' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      }
    });
  </script>
</body>
